name: Deploy SAM on push

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package CloudFormation (upload artifacts to S3)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudformation package \
            --template-file template.yaml \
            --s3-bucket $S3_BUCKET \
            --output-template-file packaged.yaml \
            --region $AWS_REGION

      - name: Deploy CloudFormation Stack
        env:
          STACK_NAME: ${{ secrets.STACK_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudformation deploy \
            --template-file packaged.yaml \
            --stack-name $STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM \
            --region $AWS_REGION

      - name: Print Stack Outputs
        env:
          STACK_NAME: ${{ secrets.STACK_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudformation describe-stacks --stack-name $STACK_NAME --region $AWS_REGION --query "Stacks[0].Outputs" --output json
